<div class="container mt-4">
    <div class="row mb-3">
        <div class="col d-flex justify-content-between align-items-center flex-wrap">
            <h2 class="mb-2">Hiriburuetako Uneko Tenperaturak</h2>
            <span [className]="txapaKlasea" class="badge fs-6 mb-2">{{ txapaTestua }}</span>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-12 bg-white p-4 rounded shadow-sm">
            <canvas id="eguraldiGrafikoa" height="100"></canvas>
        </div>
    </div>

    <div class="row mb-5">
        <div class="col d-flex justify-content-between align-items-center flex-wrap">
            <p class="text-muted mb-2 fw-bold">Azken eguneratzea: <span class="fw-normal">{{ ordua }}</span></p>
            <button (click)="kargatuDatuak()" [disabled]="botoiaDesgaituta" class="btn btn-primary mb-2">
                <i class="bi bi-arrow-clockwise"></i> Berritu Datuak Eskuz
            </button>
        </div>
    </div>
</div>
